<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error 404</title>
  <link rel="stylesheet" href="cursor.css" />
  <style>
    @font-face {
      font-family: "Metropolis";
      src: url("assets/Metropolis-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }

    :root {
      color-scheme: dark;
      font-family: "Metropolis", Arial, sans-serif;
      background: #000;
      color: #f4f4f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #000;
    }

    .error-screen {
      width: 100%;
      padding: 40px 24px;
      font-size: 16px;
      line-height: 1.3;
      letter-spacing: .01em;
    }

    .message {
      width: 355px;
      max-width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .message p {
      margin: 0 0 18px;
    }

    .error-code { margin: 0; }
  </style>
</head>
<body>
  <main class="error-screen" role="alert">
    <section class="message">
      <p>An error has occurred with the page.<br />
      Please make sure the link you typed is correct.</p>

      <p class="error-code">Error code: 404</p>
    </section>
  </main>
</body>
</html>
